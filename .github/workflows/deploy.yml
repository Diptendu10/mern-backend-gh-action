name: Deploy MERN Backend to EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Server Syntax
        run: node --check src/server.js

  deploy:
    name: Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-24.04

    steps:
      - name: Deploy Backend via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m

          script: |
            set -e

            APP_DIR="/var/www/backend"
            REPO="https://github.com/myselfrahul1510/mern-backend-gh-action.git"

            echo "========================================="
            echo "DEPLOYMENT STARTED"
            date
            echo "========================================="

            # Check required commands
            command -v git
            command -v node
            command -v npm
            command -v pm2

            # Check application directory
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "ERROR: Git repository not found in $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"

            # Preserve .env and logs directory
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "ERROR: .env file is missing!"
              exit 1
            fi

            echo "Updating repository..."

            git fetch origin main
            git reset --hard origin/main

            # Clean untracked files, preserving .env and logs
            git clean -fd -e .env -e logs/

            # Ensure logs directory exists BEFORE PM2 reload
            mkdir -p "$APP_DIR/logs"

            # Validate required files
            echo "Checking required files..."

            test -f package.json
            test -f package-lock.json
            test -f src/server.js
            test -f ecosystem.config.js
            test -f .env

            # Install production dependencies
            echo "Installing production dependencies..."
            npm ci --omit=dev

            # Ensure PM2 is available
            pm2 --version

            # Restart application
            echo "Restarting backend..."

            # Remove existing PM2 app to avoid reload issues
            if pm2 describe backend-api >/dev/null 2>&1; then
              pm2 delete backend-api
            fi

            # Start fresh using ecosystem config
            pm2 start ecosystem.config.js --env production

            # Save PM2 process list
            pm2 save

            echo "Waiting for backend..."
            sleep 8

            # Show PM2 status
            pm2 status

            # Health check with retries
            echo "Running health check..."

            HEALTH_URL="http://127.0.0.1:5000/api/health"
            HEALTH_OK=0

            for i in $(seq 1 12); do
              HTTP_CODE=$(curl -sS -o /tmp/backend-health.json \
                -w "%{http_code}" \
                --max-time 5 "$HEALTH_URL" || true)

              echo "Health check attempt $i: HTTP $HTTP_CODE"

              if [ "$HTTP_CODE" = "200" ]; then
                cat /tmp/backend-health.json
                HEALTH_OK=1
                break
              fi

              sleep 5
            done

            # Diagnostics if health check fails
            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "ERROR: Health check failed"

              echo "----- PM2 STATUS -----"
              pm2 status || true

              echo "----- PM2 DESCRIPTION -----"
              pm2 describe backend-api || true

              echo "----- PM2 LOGS -----"
              pm2 logs backend-api --lines 100 --nostream || true

              echo "----- LISTENING PORTS -----"
              sudo ss -lntp || true

              echo "----- LOG DIRECTORY -----"
              ls -la "$APP_DIR/logs" || true

              exit 1
            fi

            echo "========================================="
            echo "DEPLOYMENT SUCCESSFUL"
            date
            echo "========================================="